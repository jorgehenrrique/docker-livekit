# Local / VPS smoke test — UDP preferred (not Railway).
# Usage:
#   export LIVEKIT_API_KEY=... LIVEKIT_API_SECRET=...
#   docker compose up --build
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      PORT: "7880"
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      LIVEKIT_FORCE_TCP: "false"
      LIVEKIT_UDP_PORT_START: "50000"
      LIVEKIT_UDP_PORT_END: "50100"
      LIVEKIT_REDIS_HOST: redis
      LIVEKIT_REDIS_PORT: "6379"
      LIVEKIT_LOG_LEVEL: info

volumes:
  redis_data:
